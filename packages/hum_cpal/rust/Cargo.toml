[package]
name = "hum_cpal"
version = "0.1.0"
edition = "2024"
authors = ["Alex Baker"]
description = "CPAL audio backend for Hum (Dart FFI)"
homepage = "https://alxbkr.xyz"
repository = "https://github.com/alexobviously/hum/tree/main/packages/hum_cpal/rust"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
