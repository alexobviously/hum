[package]
name = "hum_cpal"
version = "0.1.1"
edition = "2024"
authors = ["Alex Baker"]
description = "CPAL audio backend for Hum (Dart FFI)"
homepage = "https://alxbkr.xyz"
repository = "https://github.com/alexobviously/hum/tree/main/packages/hum_cpal/rust"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
cpal = { version = "0.18.2", features = ["realtime"] }
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
