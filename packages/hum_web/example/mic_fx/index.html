<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hum_web Mic FX Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    .warn { background: #fff8e1; border-left: 4px solid #f59e0b; padding: 0.6rem 0.9rem; margin: 1rem 0; font-size: 0.9rem; }
    label { display: block; margin-top: 1.1rem; }
    input[type="range"] { width: 100%; }
    #status { margin-top: 1.2rem; color: #555; }
  </style>
</head>
<body>
  <h1>hum_web Live Mic FX</h1>
  <div class="warn">Use headphones to avoid microphone feedback.</div>
  <button id="toggle">Start Mic FX</button>

  <label>
    Delay Time (s):
    <input id="delayTime" type="range" min="0.05" max="1.0" value="0.28" step="0.01" />
  </label>
  <label>
    Delay Feedback:
    <input id="feedback" type="range" min="0.0" max="0.85" value="0.35" step="0.01" />
  </label>
  <label>
    Reverb Room Size:
    <input id="roomSize" type="range" min="0.1" max="0.95" value="0.72" step="0.01" />
  </label>
  <label>
    Reverb Mix:
    <input id="reverbMix" type="range" min="0.0" max="1.0" value="0.35" step="0.01" />
  </label>
  <label>
    Output Gain:
    <input id="gain" type="range" min="0.0" max="1.2" value="0.8" step="0.01" />
  </label>

  <p id="status">Idle — run <code>dart run packages/hum_web/example/serve.dart mic_fx</code> and click Start Mic FX.</p>
  <script type="module">
    import { compileStreaming } from './build/main.mjs';
    const compiled = await compileStreaming(fetch('./build/main.wasm'));
    const app = await compiled.instantiate();
    app.invokeMain();
  </script>
</body>
</html>
