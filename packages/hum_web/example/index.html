<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hum_web Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    label { display: block; margin-top: 1.5rem; }
    input[type="range"] { width: 100%; }
    #status { margin-top: 1rem; color: #555; }
  </style>
</head>
<body>
  <h1>hum_web AudioWorklet Demo</h1>
  <button id="toggle">Start Audio</button>
  <label>
    Frequency (Hz):
    <input id="freq" type="range" min="110" max="880" value="220" step="1" />
  </label>
  <p id="status">Idle — click Start Audio (compile example/main.dart to build/main.wasm first).</p>
  <script type="module">
    import { compileStreaming } from './build/main.mjs';
    const compiled = await compileStreaming(fetch('./build/main.wasm'));
    const app = await compiled.instantiate();
    app.invokeMain();
  </script>
</body>
</html>
