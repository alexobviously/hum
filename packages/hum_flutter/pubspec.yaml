name: hum_flutter
description: Cross-platform Flutter integration for the Hum audio DSP engine across desktop, iOS, and Web.
version: 0.1.0
resolution: workspace
homepage: https://alxbkr.xyz
repository: https://github.com/alexobviously/hum/tree/main/packages/hum_flutter
issue_tracker: https://github.com/alexobviously/hum/issues
topics:
  - audio
  - dsp
  - flutter
  - synthesizer
  - sound

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  hum: ^0.1.0
  hum_cpal: ^0.1.0
  hum_web: ^0.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: xyz.alxbkr.hum_flutter
        pluginClass: HumFlutterPlugin
